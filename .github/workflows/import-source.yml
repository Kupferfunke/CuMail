name: Import verified CuMail source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Kupferfunke/CuMail' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and unpack the reviewed source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, stat, zipfile
          archive = pathlib.Path('CuMail-source.zip')
          expected = '59291139954574aaee1ef9ab56270c4de0171dbace68856c714d21554398715d'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Archive checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              if len(entries) != 459:
                  raise SystemExit('Unexpected file count')
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  mode = entry.external_attr >> 16
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts or '.github' in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit('Unsafe archive path or link')
              for entry in entries:
                  path = pathlib.Path(entry.filename)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(source.read(entry))
                  path.chmod(0o755 if (entry.external_attr >> 16) & 0o111 else 0o644)
          archive.unlink()
          print('Verified and extracted all 459 reviewed source files.')
          PY
      - name: Commit the source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish reviewed CuMail source with original file modes'
          git push origin HEAD:main
